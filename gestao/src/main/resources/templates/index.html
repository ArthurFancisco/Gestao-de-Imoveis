<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImobiGestão | Painel Principal</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           1. VARIÁVEIS CSS (Design System)
           ========================================= */
        :root {
            --font-family: 'Inter', sans-serif;
            
            /* Cores de Fundo */
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --bg-sidebar: #0f172a;
            
            /* Cores de Texto */
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-sidebar: #94a3b8;
            --text-sidebar-hover: #f8fafc;
            
            /* Cores de Marca / Ação */
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --danger: #ef4444;
            
            /* Estrutura e Sombras */
            --border-color: #e2e8f0;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            
            /* Transições */
            --transition: all 0.2s ease-in-out;
        }

        /* =========================================
           2. RESET E BASE
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button { cursor: pointer; font-family: inherit; }

        /* =========================================
           3. LAYOUT PRINCIPAL (Grid)
           ========================================= */
        .app-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        /* =========================================
           4. SIDEBAR
           ========================================= */
        .sidebar {
            background-color: var(--bg-sidebar);
            color: var(--text-sidebar);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--bg-surface);
            margin-bottom: 3rem;
            padding-left: 0.5rem;
        }

        .sidebar-brand i { color: var(--primary); }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-link i { font-size: 1.1rem; width: 20px; text-align: center; }

        .nav-link:hover, .nav-link.active {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-sidebar-hover);
        }

        .nav-divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.1);
            margin: 1rem 0;
        }

        .nav-link-danger:hover {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* =========================================
           5. ÁREA PRINCIPAL E TOPBAR
           ========================================= */
        .main-content {
            padding: 2rem 3rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            overflow-y: auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-surface);
            padding: 1.25rem 2rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .topbar-actions {
            display: flex;
            gap: 1rem;
        }

        /* Botões */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.875rem;
            transition: var(--transition);
            border: none;
        }

        .btn-primary {
            background-color: var(--text-primary);
            color: var(--bg-surface);
        }

        .btn-primary:hover { background-color: #000000; }

        .btn-outline {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover { background-color: var(--bg-body); }

        .btn-icon {
            padding: 0.5rem;
            border-radius: var(--radius-md);
            background-color: var(--bg-body);
            color: var(--text-secondary);
        }
        
        .btn-icon:hover { color: var(--primary); background-color: #e0e7ff; }

        /* =========================================
           6. CARDS DE ESTATÍSTICAS
           ========================================= */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .stat-card {
            background: var(--bg-surface);
            padding: 1.5rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        /* Detalhe de cor na borda superior do card */
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
        }
        .stat-card.blue::before { background-color: var(--primary); }
        .stat-card.green::before { background-color: #10b981; }

        .stat-title {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* =========================================
           7. TABELAS DE DADOS
           ========================================= */
        .table-section {
            background: var(--bg-surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
        }

        .section-header {
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .table-responsive {
            overflow-x: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .data-table th, .data-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .data-table td {
            font-size: 0.875rem;
            color: var(--text-primary);
            vertical-align: middle;
        }

        .data-table tbody tr {
            transition: var(--transition);
        }

        .data-table tbody tr:hover { background-color: #f8fafc; }

        .data-table td.actions { text-align: right; }

        /* Badge de Status */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success { background-color: var(--success-bg); color: var(--success-text); }

        /* =========================================
           8. RESPONSIVIDADE
           ========================================= */
        @media (max-width: 992px) {
            .app-layout { grid-template-columns: 1fr; }
            .sidebar { display: none; /* Em um cenário real, aqui entraria um menu hamburger */ }
            .main-content { padding: 1.5rem; }
            .topbar { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .topbar-actions { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

<div class="app-layout">
    
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-city"></i>
            <span>ImobiGestão</span>
        </div>

        <nav class="nav-menu">
            <a th:href="@{/}" class="nav-link active">
                <i class="fas fa-building"></i> Imóveis
            </a>
            <a th:href="@{/proprietarios}" class="nav-link">
                <i class="fas fa-user-tie"></i> Proprietários
            </a>
            
            <div class="nav-divider"></div>
            
            <a href="#" class="nav-link nav-link-danger">
                <i class="fas fa-sign-out-alt"></i> Sair
            </a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <h1 class="page-title">Painel Administrativo</h1>
            <div class="topbar-actions">
                <a th:href="@{/imoveis/cadastrar}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Novo Imóvel
                </a>
                <a th:href="@{/proprietarios/cadastrar}" class="btn btn-outline">
                    <i class="fas fa-user-plus"></i> Novo Proprietário
                </a>
            </div>
        </header>

        <section class="stats-grid">
            <div class="stat-card blue">
                <span class="stat-title">Total de Imóveis</span>
                <span class="stat-value" th:text="${#lists.size(imoveis)}">0</span>
            </div>

            <div class="stat-card green">
                <span class="stat-title">Proprietários Cadastrados</span>
                <span class="stat-value" th:text="${proprietarios != null ? #lists.size(proprietarios) : 0}">0</span>
            </div>
        </section>

        <section class="table-section" th:if="${tipoLista == 'imoveis'}">
            <h2 class="section-header">Lista de Imóveis</h2>
            
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Proprietário</th>
                            <th>Endereço</th>
                            <th>Valor</th>
                            <th>Status</th>
                            <th style="text-align: right;">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="imovel : ${imoveis}">
                            <td th:text="${imovel.tipo}"></td>
                            <td th:text="${imovel.proprietario.nome}"></td>
                            <td th:text="${imovel.endereco}"></td>
                            <td th:text="${'R$ ' + #numbers.formatDecimal(imovel.valor,1,2)}"></td>
                            <td>
                                <span class="badge badge-success" th:text="${imovel.status}"></span>
                            </td>
                            <td class="actions">
                                <a th:href="@{'/imoveis/editar/' + ${imovel.id}}" class="btn-icon" title="Editar Imóvel">
                                    <i class="fas fa-edit"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="table-section" th:if="${tipoLista == 'proprietarios'}">
            <h2 class="section-header">Lista de Proprietários</h2>
            
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Qtd. Imóveis</th>
                            <th>CPF</th>
                            <th>Telefone</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="prop : ${proprietarios}">
                            <td th:text="${prop.nome}"></td>
                            <td th:text="${#lists.size(prop.imoveis)}"></td>
                            <td th:text="${prop.cpf}"></td>
                            <td th:text="${prop.telefone}"></td>
                            <td th:text="${prop.email}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
</div>

</body>
</html>
