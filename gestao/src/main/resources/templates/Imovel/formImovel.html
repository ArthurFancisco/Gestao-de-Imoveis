<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Imóvel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">

<h2 class="mb-4">Cadastro de Imóvel</h2>

<form th:action="@{/imoveis/salvar}" th:object="${imovel}" method="post">

    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
        <label class="form-label">Endereço</label>
        <input type="text" class="form-control" th:field="*{endereco}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Valor</label>
        <input type="number" step="0.01" class="form-control" th:field="*{valor}">
    </div>

    <div class="mb-3">
        <label class="form-label">Tipo</label>
        <select class="form-select" th:field="*{tipo}">
            <option value="APARTAMENTO">Apartamento</option>
            <option value="CASA">Casa</option>
            <option value="COMERCIAL">Comercial</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-select" th:field="*{status}">
            <option value="DISPONIVEL">Disponível</option>
            <option value="ALUGADO">Alugado</option>
            <option value="VENDIDO">Vendido</option>
        </select>
    </div>

    <button type="submit" class="btn btn-dark">Salvar</button>
</form>

</body>
</html>
