<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Proprietários</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Proprietários Cadastrados</h2>

    <div class="mb-3">
        <a th:href="@{/proprietarios/cadastrar}"
           class="btn btn-primary">
            Novo Proprietário
        </a>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="prop : ${proprietarios}">
                <td th:text="${prop.id}"></td>
                <td th:text="${prop.nome}"></td>
                <td th:text="${prop.cpf}"></td>
                <td th:text="${prop.telefone}"></td>
                <td th:text="${prop.email}"></td>

                <td>
                    <a th:href="@{/proprietarios/editar/{id}(id=${prop.id})}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>

                    <a th:href="@{/proprietarios/excluir/{id}(id=${prop.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Deseja realmente excluir?')">
                        Excluir
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(proprietarios)}">
                <td colspan="6" class="text-center">
                    Nenhum proprietário cadastrado.
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
